# Verifica que o app iOS compila (simulador, sem assinatura). Para instalar em iPhone/publicar,
# abra ios/App/App.xcworkspace no Xcode com uma conta Apple Developer.
name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    env:
      # endereço público do servidor online (padrão: o eco-server no Render; dá para trocar pela variável ECO_SERVER_URL do repositório)
      VITE_SERVER_URL: ${{ vars.ECO_SERVER_URL || 'https://eco-server-u6u5.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Compilar para o simulador
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
