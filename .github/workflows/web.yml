# Publica a versão web (PWA) no GitHub Pages: https://<usuario>.github.io/<repositorio>/
# Ative uma vez em Settings → Pages → Source: "GitHub Actions".
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # endereço público do servidor online (variável do repositório: Settings → Secrets and variables → Actions → Variables)
      VITE_SERVER_URL: ${{ vars.ECO_SERVER_URL }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
