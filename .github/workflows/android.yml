# Compila o app Android na nuvem do GitHub. Resultado: ECO-android.apk (aba Actions → execução → Artifacts).
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # endereço público do servidor online (padrão: o eco-server no Render; dá para trocar pela variável ECO_SERVER_URL do repositório)
      VITE_SERVER_URL: ${{ vars.ECO_SERVER_URL || 'https://eco-server-u6u5.onrender.com' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Assinar versão de loja (opcional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > eco.keystore
          ./gradlew bundleRelease --no-daemon
          jarsigner -keystore eco.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ECO-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ECO-android
          path: |
            ECO-android.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
      - name: Publish APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ECO-android.apk \
            --title "ECO (Android)" \
            --notes "Latest APK built from ${GITHUB_SHA::7}. Download ECO-android.apk on your Android phone and open it."
