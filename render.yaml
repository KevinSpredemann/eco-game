services:
  # the game itself (PWA): static files
  - type: web
    name: eco-game
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      # online server name inside Render (e.g. eco-server-ab12); the game adds .onrender.com to reach it
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: eco-server
          property: host
    headers:
      # the service worker must always be fresh so updates reach players
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # hashed build files never change
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # online server: login, coins, rooms and matches
  - type: web
    name: eco-server
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SECRET
        generateValue: true
      # Neon connection string (postgresql://...). Render asks for it on the first sync.
      - key: DATABASE_URL
        sync: false
